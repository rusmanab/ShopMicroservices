services:
  catalogdb:
    container_name: catalogdb
    environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=Catalogdb
    restart: always
    ports:
        - "5432:5432"
    volumes:
        - postgres_catalog:/var/lib/postgresql/ 
  catalog.api:
    environment:
      - APSNETCORE_ENVIRONMENT=Development
      - APSNETCORE_HTTP_PORT=8080
      - APSNETCORE_HTTPS_PORT=8081
      - ConnectionStrings__Database=catalogdb;Port=5423; 
    depends_on:
      - catalogdb
    ports:
      - "6000:8080"
      - "6060:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
